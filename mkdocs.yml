# 导航树 引号可以省略。开头的点和斜杠也可以省略 ("./HOME/about.md" 或 Home/about.md) 。
#注意，导航树这里的文件名是 filename.md 这样的，但在文件夹中，它实际上被命名为 filename.en.md 和 filename.zh.md。
# 其中，filename.en.md 也可以被命名为 filename.md，但是 filename.zh.md 不能被命名为 filename.md，否则会导致无法识别。
#i18n插件会自动识别文件名，然后根据文件名的后缀来切换语言。所以，如果你想添加一个新页面，你需要添加两个文件，一个是 filename.en.md，另一个是 filename.zh.md。
#默认语言的后缀可以省略，比如当前默认为en时，可以写成 "index.md" 而不是 "index.en.md"。值得注意的是，如果当前默认为英文，则不能同时出现index.md和index.en.md，否则会视为重复文件导致编译错误
#多语言控制的只是网页相关的导航栏。如果开了多语言但是没有配置两种文件，会导致用户在切换语言时，页面会404。

